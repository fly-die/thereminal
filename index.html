<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070707" />
    <title>thereminal</title>
    <meta name="description" content="A synthesizer you play with your hands in the air. Runs in the browser, nothing is uploaded." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="thereminal" />
    <meta property="og:description" content="A synthesizer you play with your hands in the air. Runs in the browser, nothing is uploaded." />
    <style>html { background: #070707; }</style>
  </head>
  <body>
    <div id="app">
      <section class="panel" id="p-pitch">
        <h2>pitch</h2>
        <canvas id="ruler"></canvas>
      </section>
      <section class="panel" id="p-cam">
        <h2>camera <span id="cam-mode"></span></h2>
        <video id="cam" playsinline muted></video>
        <canvas id="view"></canvas>
        <div id="hint" hidden>raise your hand</div>
        <div id="notice" hidden></div>
      </section>
      <aside id="side">
        <section class="panel" id="p-preset">
          <h2>preset</h2>
          <ol class="panel-body" id="presets"></ol>
        </section>
        <section class="panel" id="p-controls">
          <h2>controls</h2>
          <div class="panel-body" id="controls"></div>
        </section>
        <section class="panel" id="p-setup">
          <h2>setup</h2>
          <dl class="panel-body" id="setup"></dl>
        </section>
      </aside>
      <section class="panel" id="p-scope">
        <h2>scope</h2>
        <canvas id="scope"></canvas>
      </section>
      <footer id="status"></footer>
    </div>
    <div id="boot"><pre id="boot-log"></pre></div>
    <div id="help" class="modal" hidden></div>
    <div id="palette" class="modal" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
