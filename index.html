<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070707" />
    <title>thereminal</title>
    <meta name="description" content="A synthesizer you play with your hands in the air. Runs in the browser, camera and audio never leave your device." />
    <link rel="preload" href="/fonts/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="thereminal" />
    <meta property="og:description" content="A synthesizer you play with your hands in the air. Runs in the browser, camera and audio never leave your device." />
    <meta property="og:url" content="https://thereminal.flynndiener.ch/" />
    <meta property="og:image" content="https://thereminal.flynndiener.ch/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>html { background: #070707; }</style>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <div id="app">
      <section class="panel" id="p-pitch">
        <h2>pitch</h2>
        <canvas id="ruler" aria-label="notes of the current scale, with the playing note marked"></canvas>
      </section>
      <section class="panel" id="p-cam">
        <h2>camera <span id="cam-mode"></span></h2>
        <video id="cam" playsinline muted></video>
        <canvas id="view" aria-label="camera view with the tracked hands drawn on top"></canvas>
        <div id="hint" role="status" hidden>raise your hand</div>
        <div id="notice" role="status" aria-live="polite" hidden></div>
      </section>
      <aside id="side">
        <section class="panel" id="p-preset">
          <h2>preset</h2>
          <ol class="panel-body" id="presets"></ol>
        </section>
        <section class="panel" id="p-controls">
          <h2>controls</h2>
          <div class="panel-body" id="controls"></div>
        </section>
        <section class="panel" id="p-setup">
          <h2>setup</h2>
          <dl class="panel-body" id="setup"></dl>
        </section>
      </aside>
      <section class="panel" id="p-scope">
        <h2>scope</h2>
        <canvas id="scope" aria-label="oscilloscope and spectrum of the sound"></canvas>
      </section>
      <footer id="status"></footer>
    </div>
    <div id="boot"><pre id="boot-log"></pre></div>
    <div id="help" class="modal" hidden></div>
    <div id="palette" class="modal" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
